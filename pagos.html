<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Pago - 3er Round Fit</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color:#000;color:#fff;">
    <nav class="navbar" style="position:static;background:#0a0a0a;border-bottom:1px solid #222;">
        <a href="dashboard.html" class="brand-logo" style="margin-top:5px;">
            <img src="assets/logo.png" alt="3er Round Fit" style="height:50px;object-fit:contain;">
        </a>
    </nav>
    <div class="form-container" style="margin-top:40px;margin-bottom:40px;">
        <h2 class="huge-text" style="font-size:2.5rem;text-align:center;">REPORTE DE PAGO</h2>
        <p class="desc" style="text-align:center;">Llena este formulario para notificar tu pago de mensualidad a Grey.</p>
        <form id="pagoForm">
            <div class="form-group">
                <label>Tu Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Jesus Huele">
            </div>
            <div class="form-group">
                <label>Plan que estas pagando</label>
                <select id="plan" required style="width:100%;padding:15px;background:#111;color:#fff;border:1px solid #333;font-family:var(--font-body);font-size:1rem;outline:none;">
                    <option value="Plan PRO (60 EUR)">Plan PRO (60 EUR)</option>
                    <option value="Plan Amateur (50 EUR)">Plan Amateur - 3 dias/sem (50 EUR)</option>
                    <option value="Plan Infantil (40 EUR)">Plan Infantil (40 EUR)</option>
                    <option value="Plan Personalizado (100 EUR)">Plan Personalizado (100 EUR)</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Metodo de Pago</label>
                    <select id="metodo" required style="width:100%;padding:15px;background:#111;color:#fff;border:1px solid #333;font-family:var(--font-body);font-size:1rem;outline:none;">
                        <option value="Pago Movil">Pago Movil</option>
                        <option value="Transferencia">Transferencia Nacional</option>
                        <option value="Zelle">Zelle</option>
                        <option value="Efectivo">Efectivo (Entregado en Box)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Monto Pagado</label>
                    <input type="text" id="monto" required placeholder="Ej. 60 o 2500 Bs">
                </div>
            </div>
            <div class="form-group">
                <label>Numero de Referencia (Obligatorio)</label>
                <input type="text" id="referencia" required placeholder="Ej. 12345678" style="font-family:monospace;font-size:1.2rem;letter-spacing:2px;">
                <p style="font-size:0.8rem;color:#888;margin-top:5px;">*Si pagaste en efectivo, escribe 0000</p>
            </div>
            <button type="submit" class="btn-brutal" style="width:100%;margin-top:20px;">ENVIAR REPORTE POR WHATSAPP</button>
            <div style="text-align:center;margin-top:20px;">
                <a href="dashboard.html" style="color:#888;text-decoration:none;">&larr; Cancelar</a>
            </div>
        </form>
    </div>
    <script src="auth.js"></script>
    <script>
        const session = requireUser();
        if (session) {
            // Pre-llenar nombre desde sesion
            document.getElementById("nombre").value = session.nombre || "";
        }

        document.getElementById("pagoForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const nombre = document.getElementById("nombre").value;
            const plan = document.getElementById("plan").value;
            const metodo = document.getElementById("metodo").value;
            const monto = document.getElementById("monto").value;
            const referencia = document.getElementById("referencia").value;

            const mensaje = "REPORTE DE PAGO DE MENSUALIDAD\n\n" +
                            "Atleta: " + nombre + "\n" +
                            "Plan: " + plan + "\n" +
                            "Metodo: " + metodo + "\n" +
                            "Monto: " + monto + "\n" +
                            "Referencia: " + referencia + "\n\n" +
                            "Por favor valida este pago y actualiza mi estado en el sistema.";

            window.open("https://wa.me/584248576200?text=" + encodeURIComponent(mensaje), "_blank");
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
