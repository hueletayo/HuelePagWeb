<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi portal - 3er Round Fit</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260907e">
    <link rel="stylesheet" href="design-system.css?v=20260907e">
    <style>
        .estado-card { text-align: center; padding: var(--ds-4) var(--ds-3); }
        .estado-badge {
            display: inline-block; font-family: var(--font-display);
            font-size: 1.6rem; letter-spacing: 2px; padding: 10px 24px;
            margin: var(--ds-2) 0;
        }
        .horario-dia {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: var(--ds-3); padding: 12px 0; border-bottom: 1px solid var(--ds-border);
            flex-wrap: wrap;
        }
        .horario-dia:last-child { border-bottom: none; }
        .horario-dia b {
            font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 1px;
        }
        .horario-horas { display: flex; gap: 7px; flex-wrap: wrap; }
        .horario-horas span {
            border: 1px solid var(--ds-border); padding: 5px 10px;
            font-size: 0.82rem; font-weight: 600;
        }
        .horario-horas span.destacado {
            background: var(--accent-color); border-color: var(--accent-color); color: #000;
        }
    </style>
</head>
<body class="ds-page">

    <header class="ds-masthead">
        <div class="ds-masthead-bar">
            <a href="index.html" aria-label="Ir al inicio"><img src="assets/logo.png" alt="3er Round Fit"></a>
            <button type="button" class="ds-btn-sm" id="btn-logout">Cerrar sesión</button>
        </div>
        <div class="ds-masthead-body">
            <h1 class="ds-display" id="saludo">
                <span class="ds-outline">PORTAL</span><br>DEL ATLETA
            </h1>
            <p class="ds-kicker" id="kicker">Porque amamos el boxeo <span class="accent">//</span> Lechería</p>
        </div>
    </header>

    <div class="ds-marquee-wrap">
        <div class="ds-marquee" aria-hidden="true">
            <span>SUDOR &amp; GLORIA • TRX • FUERZA • VELOCIDAD • 3ER ROUND FIT • </span>
            <span>SUDOR &amp; GLORIA • TRX • FUERZA • VELOCIDAD • 3ER ROUND FIT • </span>
        </div>
    </div>

    <main class="ds-wrap" id="main-content">
        <div class="ds-loader">Cargando...</div>
    </main>

    <script src="auth.js?v=20260907e"></script>
    <script>
        const session = requireUser();
        document.getElementById("btn-logout").addEventListener("click", logout);
        if (session) cargarDashboard(session);

        /* Construimos el DOM con textContent, nunca concatenando HTML:
           el nombre lo escribe el propio atleta y podría traer markup. */
        function el(tag, className, texto) {
            const n = document.createElement(tag);
            if (className) n.className = className;
            if (texto !== undefined && texto !== null) n.textContent = texto;
            return n;
        }

        function fila(clave, valor) {
            const row = el("div", "ds-row");
            row.append(el("span", "ds-row-key", clave), el("span", "ds-row-val", valor || "—"));
            return row;
        }

        // El "//" lo añade el CSS a partir del <span>, igual que en la landing
        function seccionLabel(num, texto) {
            const h2 = el("h2", "ds-section-label");
            h2.append(el("span", null, num), texto);
            return h2;
        }

        function bloqueHorario(dia, horas, destacada) {
            const wrap = el("div", "horario-dia");
            wrap.append(el("b", null, dia));
            const cont = el("div", "horario-horas");
            horas.forEach(function (h) {
                cont.append(el("span", h === destacada ? "destacado" : null, h));
            });
            wrap.append(cont);
            return wrap;
        }

        async function cargarDashboard(session) {
            const main = document.getElementById("main-content");

            let d;
            try {
                const res = await apiFetch("/athletes/" + session.id);
                if (!res.ok) { logout(); return; }
                d = (await res.json()).data;
                saveUser(d);
            } catch (err) {
                main.replaceChildren();
                const aviso = el("div", "ds-alert ds-alert--danger",
                    "No pudimos cargar tus datos. Revisa tu conexión y recarga la página.");
                main.append(aviso);
                return;
            }

            const vigente = d.estado === "VIGENTE";
            main.replaceChildren();

            // --- Saludo en el masthead (el nombre va con textContent, nunca innerHTML) ---
            const saludo = document.getElementById("saludo");
            const primerNombre = (d.nombre || "").trim().split(/\s+/)[0] || "ATLETA";
            saludo.replaceChildren("HOLA,", document.createElement("br"),
                el("span", "ds-outline", primerNombre.toUpperCase()));
            document.getElementById("kicker").textContent =
                vigente ? "Membresía al día // Sigue entrenando"
                        : "Pago pendiente // Repórtalo para renovar";

            // --- Estado de membresía ---
            const estado = el("section", "ds-panel estado-card ds-mt-4");
            estado.append(el("p", "ds-row-key", "Estado de tu membresía"));

            const badge = el("div", "estado-badge " + (vigente ? "ds-badge--ok" : "ds-badge--danger"),
                d.estado || "PENDIENTE");
            estado.append(badge);
            estado.append(el("p", "ds-subtitle", vigente
                ? "Tu membresía está al día. ¡Sigue entrenando!"
                : "Tu pago está pendiente. Repórtalo para renovar tu mes."));
            main.append(estado);

            // --- Datos de pago ---
            const datos = el("section", "ds-panel ds-mt-3");
            const rows = el("div", "ds-rows");
            rows.append(fila("Último pago", d.ultimoPago));
            rows.append(fila("Próximo pago", d.proximoPago));
            rows.append(fila("Cédula", d.cedula));
            datos.append(rows);

            const acciones = el("div", "ds-actions ds-mt-3");
            const btnPago = el("a", "ds-btn ds-btn--primary", "Reportar pago");
            btnPago.href = "pagos.html";
            acciones.append(btnPago);
            datos.append(acciones);
            main.append(datos);

            // --- Horarios: la razón nº1 para abrir el portal ---
            const horarios = el("section", "ds-panel ds-mt-3");
            horarios.append(seccionLabel("01", "Horarios de clase"));
            horarios.append(bloqueHorario("Lun - Vie · Mañana",
                ["07:30", "08:30", "09:30", "10:30"]));
            horarios.append(bloqueHorario("Lun - Vie · Tarde",
                ["03:00 (Niños)", "04:00", "05:00", "06:00", "07:00"], "03:00 (Niños)"));
            horarios.append(bloqueHorario("Sábados", ["08:30"], "08:30"));
            main.append(horarios);

            // --- Ficha de salud ---
            const salud = el("section", "ds-panel ds-mt-3");
            salud.append(seccionLabel("02", "Tu ficha de salud"));
            const saludRows = el("div", "ds-rows");
            saludRows.append(fila("Condición médica", d.condicionMedica));
            saludRows.append(fila("Lesiones", d.lesiones));
            saludRows.append(fila("Operaciones", d.operaciones));
            saludRows.append(fila("Contacto de emergencia", d.contactoEmergencia));
            salud.append(saludRows);

            const editar = el("a", "ds-btn ds-btn--ghost ds-mt-3", "Actualizar mis datos");
            editar.href = "completar_perfil.html";
            salud.append(editar);
            main.append(salud);

            // --- Contacto ---
            const ayuda = el("section", "ds-panel ds-mt-3");
            ayuda.append(seccionLabel("03", "¿Necesitas algo?"));
            const links = el("div", "ds-actions");

            const wa = el("a", "ds-btn ds-btn--ghost", "Escribir por WhatsApp");
            wa.href = "https://wa.me/584248576200";
            wa.target = "_blank";
            wa.rel = "noopener";

            const mapa = el("a", "ds-btn ds-btn--ghost", "Cómo llegar");
            mapa.href = "https://www.google.com/maps/search/?api=1&query=Centro+Empresarial+Col%C3%B3n+Vistamar+Lecher%C3%ADa+Anzo%C3%A1tegui";
            mapa.target = "_blank";
            mapa.rel = "noopener";

            links.append(wa, mapa);
            ayuda.append(links);
            main.append(ayuda);
        }
    </script>
</body>
</html>
