<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - 3er Round Fit</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #000; color: #fff; }
        .dashboard-container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .status-card { background: #111; border: 2px solid #333; padding: 30px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
        .status-badge { display: inline-block; padding: 10px 20px; font-size: 1.5rem; font-family: var(--font-display); letter-spacing: 2px; margin: 15px 0; border-radius: 4px; }
        .status-vigente { background: #00aa00; color: #fff; }
        .status-pendiente { background: #ff3333; color: #fff; }
        .data-row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 15px 0; }
        .data-label { color: #888; font-size: 0.9rem; }
        .data-value { font-weight: bold; }
        .loader { text-align: center; padding: 60px; color: #666; font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 2px; }
    </style>
</head>
<body>
    <nav class="navbar" style="position:static;background:#0a0a0a;border-bottom:1px solid #222;">
        <a href="index.html" class="brand-logo" style="margin-top:5px;">
            <img src="assets/logo.png" alt="3er Round Fit" style="height:50px;object-fit:contain;">
        </a>
        <div>
            <button id="btn-logout" class="btn-brutal" style="padding:10px 15px;font-size:0.8rem;background:transparent;color:#fff;border:1px solid #fff;">CERRAR SESION</button>
        </div>
    </nav>

    <div class="dashboard-container" id="main-content">
        <div class="loader">CARGANDO...</div>
    </div>

    <script src="auth.js"></script>
    <script>
        const session = requireUser();
        if (session) loadDashboard(session);

        async function loadDashboard(session) {
            try {
                const res = await fetch(API + "/athletes/" + session.id, {
                    headers: userHeaders(session)
                });

                if (!res.ok) { logout(); return; }

                const data = await res.json();
                const d = data.data;

                // Actualizar localStorage con datos frescos
                localStorage.setItem("atleta_data", JSON.stringify(d));

                const isVigente = d.estado === "VIGENTE";
                document.getElementById("main-content").innerHTML =
                    '<h2 class="huge-text" style="font-size:2.5rem;margin-bottom:10px;">HOLA, <span id="user-name">' + d.nombre.toUpperCase() + '</span> &#x1F94A;</h2>' +
                    '<p class="desc" style="margin-bottom:30px;">Bienvenido a tu portal de entrenamiento.</p>' +
                    '<div class="status-card">' +
                        '<h3 style="font-family:var(--font-display);font-size:1.5rem;color:#888;">ESTATUS ACTUAL</h3>' +
                        '<div class="status-badge ' + (isVigente ? "status-vigente" : "status-pendiente") + '">' + (d.estado || "PENDIENTE") + '</div>' +
                        '<p style="font-size:0.9rem;color:#aaa;">' + (isVigente ? "Tu membresia esta al dia. Sigue entrenando!" : "Tu pago esta pendiente. Reporta tu pago para renovar.") + '</p>' +
                    '</div>' +
                    '<div class="status-card" style="text-align:left;padding:20px;">' +
                        '<div class="data-row"><span class="data-label">ULTIMO PAGO</span><span class="data-value">' + (d.ultimoPago || '--/--/----') + '</span></div>' +
                        '<div class="data-row" style="border-bottom:none;"><span class="data-label">NOMBRE</span><span class="data-value">' + d.nombre + '</span></div>' +
                    '</div>' +
                    '<div style="margin-top:30px;">' +
                        '<a href="pagos.html" class="btn-brutal" style="display:block;text-align:center;width:100%;font-size:1.2rem;">REPORTAR PAGO DE MENSUALIDAD</a>' +
                    '</div>';
            } catch(err) {
                logout();
            }
        }

        document.getElementById("btn-logout").addEventListener("click", logout);
    </script>
</body>
</html>
