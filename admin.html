<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de control - 3er Round Fit</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260907f">
    <link rel="stylesheet" href="design-system.css?v=20260907f">
    <style>
        .ref-code {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 1.05rem; color: var(--accent-color); letter-spacing: 1px;
        }
        .conteo { color: var(--ds-text-mute); font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body class="ds-page">

    <header class="ds-masthead">
        <div class="ds-masthead-bar">
            <a href="index.html" aria-label="Ir al inicio"><img src="assets/logo.png" alt="3er Round Fit"></a>
            <div class="ds-actions">
                <button type="button" class="ds-btn-sm" id="btn-refrescar">Refrescar</button>
                <button type="button" class="ds-btn-sm" id="btn-logout">Cerrar sesión</button>
            </div>
        </div>
        <div class="ds-masthead-body">
            <h1 class="ds-display"><span class="ds-outline">PANEL</span><br>DE CONTROL</h1>
            <p class="ds-kicker">Aprueba registros <span class="accent">//</span> Gestiona mensualidades</p>
        </div>
    </header>

    <main class="ds-wrap ds-wrap--wide">

        <div id="error-global" class="ds-alert ds-alert--danger ds-mt-3" role="alert" hidden></div>

        <h2 class="ds-section-label">
            <span>01</span> Pendientes de aprobación
            <span class="conteo" id="conteo-pendientes"></span>
        </h2>
        <div class="ds-table-wrap ds-table-wrap--pending">
            <table class="ds-table">
                <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Cédula</th>
                        <th scope="col">Referencia de pago</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-pendientes">
                    <tr><td colspan="4" class="ds-empty">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

        <h2 class="ds-section-label">
            <span>02</span> Atletas activos
            <span class="conteo" id="conteo-activos"></span>
        </h2>
        <div class="ds-table-wrap">
            <table class="ds-table">
                <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Cédula</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Último pago</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-activos">
                    <tr><td colspan="5" class="ds-empty">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Ficha de salud -->
    <div class="ds-modal-bg" id="modal-salud">
        <div class="ds-modal" role="dialog" aria-modal="true" aria-labelledby="modal-nombre">
            <h3 id="modal-nombre">Ficha de salud</h3>
            <div class="ds-rows" id="modal-content"></div>
            <button type="button" class="ds-btn ds-btn--ghost ds-btn--block ds-mt-3" id="btn-cerrar-modal">Cerrar</button>
        </div>
    </div>

    <script src="auth.js?v=20260907f"></script>
    <script>
        const session = requireAdmin();
        if (session) cargarAtletas();

        document.getElementById("btn-logout").addEventListener("click", logout);
        document.getElementById("btn-refrescar").addEventListener("click", cargarAtletas);

        /* Todo el contenido que viene del servidor se inserta con textContent.
           Nombre, cédula y ficha de salud los escribe el propio atleta:
           antes se concatenaban en innerHTML, lo que permitía inyectar
           HTML en la sesión del administrador. */
        function el(tag, className, texto) {
            const n = document.createElement(tag);
            if (className) n.className = className;
            if (texto !== undefined && texto !== null) n.textContent = texto;
            return n;
        }

        function celda(texto, className) {
            const td = document.createElement("td");
            td.textContent = texto === null || texto === undefined || texto === "" ? "—" : texto;
            if (className) td.className = className;
            return td;
        }

        function filaVacia(tbody, colspan, texto) {
            const tr = document.createElement("tr");
            const td = el("td", "ds-empty", texto);
            td.colSpan = colspan;
            tr.append(td);
            tbody.replaceChildren(tr);
        }

        function mostrarErrorGlobal(texto) {
            const caja = document.getElementById("error-global");
            caja.textContent = texto;
            caja.hidden = false;
        }

        async function cargarAtletas() {
            const errCaja = document.getElementById("error-global");
            errCaja.hidden = true;

            try {
                const res = await apiFetch("/athletes");
                if (!res.ok) {
                    mostrarErrorGlobal("No se pudieron cargar los atletas (" + res.status + ").");
                    return;
                }
                const data = (await res.json()).data || [];
                const noAdmin = data.filter(function (a) { return a.role !== "ADMIN"; });

                renderPendientes(noAdmin.filter(function (a) { return a.estado === "EN_REVISION"; }));
                renderActivos(noAdmin.filter(function (a) { return a.estado !== "EN_REVISION"; }));
            } catch (e) {
                mostrarErrorGlobal("Error de conexión al cargar los datos.");
            }
        }

        function renderPendientes(atletas) {
            const tbody = document.getElementById("tbody-pendientes");
            document.getElementById("conteo-pendientes").textContent =
                atletas.length ? "(" + atletas.length + ")" : "";

            if (!atletas.length) {
                filaVacia(tbody, 4, "No hay cuentas pendientes por aprobar.");
                return;
            }

            const filas = atletas.map(function (a) {
                const tr = document.createElement("tr");
                tr.append(celda(a.nombre), celda(a.cedula), celda(a.referenciaRegistro, "ref-code"));

                const acciones = document.createElement("td");
                const aprobar = el("button", "ds-btn-sm ds-btn-sm--ok", "Aprobar");
                aprobar.type = "button";
                aprobar.addEventListener("click", function () { aprobarCuenta(a); });

                const rechazar = el("button", "ds-btn-sm ds-btn-sm--danger", "Rechazar");
                rechazar.type = "button";
                rechazar.style.marginLeft = "6px";
                rechazar.addEventListener("click", function () { rechazarCuenta(a); });

                acciones.append(aprobar, rechazar);
                tr.append(acciones);
                return tr;
            });
            tbody.replaceChildren.apply(tbody, filas);
        }

        function renderActivos(atletas) {
            const tbody = document.getElementById("tbody-activos");
            document.getElementById("conteo-activos").textContent =
                atletas.length ? "(" + atletas.length + ")" : "";

            if (!atletas.length) {
                filaVacia(tbody, 5, "No hay atletas activos.");
                return;
            }

            const filas = atletas.map(function (a) {
                const tr = document.createElement("tr");
                tr.append(celda(a.nombre), celda(a.cedula));

                const tdEstado = document.createElement("td");
                tdEstado.append(el("span",
                    "ds-badge " + (a.estado === "VIGENTE" ? "ds-badge--ok" : "ds-badge--danger"),
                    a.estado || "PENDIENTE"));
                tr.append(tdEstado, celda(a.ultimoPago || "Sin registrar"));

                const acciones = document.createElement("td");
                const renovar = el("button", "ds-btn-sm ds-btn-sm--primary", "Renovar");
                renovar.type = "button";
                renovar.addEventListener("click", function () { renovarPago(a); });

                const salud = el("button", "ds-btn-sm", "Ver salud");
                salud.type = "button";
                salud.style.marginLeft = "6px";
                // Pasamos el objeto por closure, no serializado en un atributo
                salud.addEventListener("click", function () { verSalud(a); });

                acciones.append(renovar, salud);
                tr.append(acciones);
                return tr;
            });
            tbody.replaceChildren.apply(tbody, filas);
        }

        async function accion(mensajeConfirm, peticion, errorTexto) {
            if (!confirm(mensajeConfirm)) return;
            try {
                const res = await peticion();
                if (res.ok) { cargarAtletas(); return; }
                const data = await res.json().catch(function () { return {}; });
                alert(data.message || errorTexto);
            } catch (e) {
                alert("Error de conexión.");
            }
        }

        function aprobarCuenta(a) {
            accion("¿Aprobar la cuenta de " + a.nombre + "? Podrá entrar al sistema.",
                function () { return apiFetch("/athletes/" + a.id + "/aprobar", { method: "PUT" }); },
                "No se pudo aprobar.");
        }

        function rechazarCuenta(a) {
            accion("¿Rechazar y ELIMINAR la cuenta de " + a.nombre + "? Esta acción no se puede deshacer.",
                function () { return apiFetch("/athletes/" + a.id, { method: "DELETE" }); },
                "No se pudo rechazar.");
        }

        function renovarPago(a) {
            accion("¿Marcar el pago de " + a.nombre + " como realizado HOY?",
                function () {
                    return apiFetch("/athletes/" + a.id + "/pago", {
                        method: "PUT",
                        body: JSON.stringify({ estado: "VIGENTE" })
                    });
                },
                "No se pudo renovar.");
        }

        // ---------- Modal de salud ----------
        const modal = document.getElementById("modal-salud");
        let ultimoFoco = null;

        function verSalud(a) {
            document.getElementById("modal-nombre").textContent = (a.nombre || "").toUpperCase();

            const cont = document.getElementById("modal-content");
            const campos = [
                ["Condición médica", a.condicionMedica],
                ["Lesiones", a.lesiones],
                ["Operaciones", a.operaciones],
                ["Contacto de emergencia", a.contactoEmergencia],
                ["Teléfono", a.telefono],
                ["Dirección", a.direccion],
                ["Instagram", a.instagram]
            ];
            cont.replaceChildren.apply(cont, campos.map(function (c) {
                const row = el("div", "ds-row");
                row.append(el("span", "ds-row-key", c[0]),
                           el("span", "ds-row-val", c[1] || "No registrado"));
                return row;
            }));

            ultimoFoco = document.activeElement;
            modal.classList.add("is-open");
            document.body.style.overflow = "hidden";
            document.getElementById("btn-cerrar-modal").focus();
        }

        function cerrarModal() {
            modal.classList.remove("is-open");
            document.body.style.overflow = "";
            if (ultimoFoco) ultimoFoco.focus();
        }

        document.getElementById("btn-cerrar-modal").addEventListener("click", cerrarModal);
        modal.addEventListener("click", function (e) { if (e.target === modal) cerrarModal(); });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && modal.classList.contains("is-open")) cerrarModal();
        });
    </script>
</body>
</html>
