<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - 3er Round Fit</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-bg { background-image: url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative; }
        .login-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.7) 100%); backdrop-filter: blur(5px); z-index: 0; }
        .glass-panel { position: relative; z-index: 1; background: rgba(15,15,15,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 50px 40px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .input-dark { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px 20px; border-radius: 8px; width: 100%; font-family: var(--font-body); font-size: 1rem; transition: all 0.3s ease; outline: none; }
        .input-dark:focus { border-color: var(--accent-color); background: rgba(0,0,0,0.8); box-shadow: 0 0 0 2px rgba(255,102,0,0.2); }
        .input-dark::placeholder { color: #666; }
        label { color: #aaa; font-size: 0.85rem; margin-bottom: 8px; display: block; }
    </style>
</head>
<body class="login-bg">
    <div class="login-overlay"></div>
    <div class="glass-panel">
        <a href="index.html" style="position:absolute;top:15px;right:20px;color:#fff;text-decoration:none;font-size:1.5rem;opacity:0.6;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">&times;</a>
        <div style="text-align:center;margin-bottom:35px;">
            <a href="index.html" class="brand-logo" style="justify-content:center;margin:0 auto;">
                <img src="assets/logo.png" alt="3er Round Fit" style="height:70px;object-fit:contain;">
            </a>
            <h2 class="huge-text" style="font-size:1.8rem;margin-top:15px;letter-spacing:1px;">PORTAL DEL ATLETA</h2>
        </div>
        <form id="loginForm">
            <div class="form-group" style="margin-bottom:15px;">
                <label>Correo Electronico</label>
                <input type="email" id="email" class="input-dark" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group" style="margin-bottom:25px;">
                <label>Contrasena</label>
                <input type="password" id="password" class="input-dark" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
            </div>
            <button type="submit" class="btn-brutal" id="btn-login" style="width:100%;border-radius:8px;font-size:1.1rem;padding:15px;">INGRESAR AL RING</button>
            <div id="error-msg" style="color:#ff5555;margin-top:15px;text-align:center;display:none;font-size:0.9rem;"></div>
        </form>
        <div style="text-align:center;margin-top:25px;">
            <p style="color:#aaa;font-size:0.95rem;font-family:var(--font-body);">No tienes cuenta? <a href="registro.html" style="color:var(--accent-color);font-weight:bold;text-decoration:none;">Registrate aqui</a></p>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
        // Si ya hay sesion activa, redirigir segun rol
        (function() {
            const s = getSession();
            if (s && s.id) {
                if (s.role === "ADMIN") window.location.href = "admin.html";
                else if (s.perfilCompletado) window.location.href = "dashboard.html";
                else window.location.href = "completar_perfil.html";
            }
        })();

        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-login");
            const errorMsg = document.getElementById("error-msg");
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;
            errorMsg.style.display = "none";

            try {
                const res = await fetch(API + "/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success && data.data) {
                    localStorage.setItem("atleta_data", JSON.stringify(data.data));
                    const d = data.data;
                    if (d.role === "ADMIN") {
                        window.location.href = "admin.html";
                    } else if (!d.perfilCompletado) {
                        window.location.href = "completar_perfil.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                } else {
                    btn.innerText = "INGRESAR AL RING";
                    btn.disabled = false;
                    errorMsg.innerText = data.message || "Credenciales invalidas.";
                    errorMsg.style.display = "block";
                }
            } catch(err) {
                btn.innerText = "INGRESAR AL RING";
                btn.disabled = false;
                errorMsg.innerText = "Error de conexion. Intenta de nuevo.";
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
