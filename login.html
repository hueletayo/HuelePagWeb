<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - 3er Round Fit</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260907v">
    <link rel="stylesheet" href="design-system.css?v=20260907v">
    <style>
        .auth-bg {
            background: #000 url('assets/hero-poster.jpg') center/cover no-repeat;
            min-height: 100vh; min-height: 100svh;
            display: flex; align-items: center; justify-content: center;
            padding: var(--ds-3); position: relative;
        }
        .auth-scrim {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(0,0,0,.94) 0%, rgba(0,0,0,.78) 100%);
        }
        .auth-panel { position: relative; z-index: 1; width: 100%; max-width: 430px; }
        .auth-close {
            position: absolute; top: 10px; right: 14px;
            color: var(--ds-text-mute); text-decoration: none;
            font-size: 1.6rem; line-height: 1; padding: 4px;
        }
        .auth-close:hover { color: #fff; }
    </style>
</head>
<body class="auth-bg">
    <div class="auth-scrim"></div>

    <main class="auth-panel">
        <div class="ds-panel ds-panel--accent">
            <a href="index.html" class="auth-close" aria-label="Volver al inicio">&times;</a>

            <div class="ds-center" style="margin-bottom: var(--ds-4);">
                <a href="index.html"><img src="assets/logo.png" alt="3er Round Fit" style="height:62px;object-fit:contain;"></a>
                <h1 class="ds-display" style="margin-top: var(--ds-2);"><span class="ds-outline">PORTAL</span><br>DEL ATLETA</h1>
            </div>

            <div id="aviso" class="ds-alert ds-alert--warn" hidden></div>

            <form id="loginForm" novalidate>
                <div class="ds-field">
                    <label class="ds-label" for="email">Correo electrónico</label>
                    <input type="email" id="email" class="ds-input" placeholder="tu@correo.com" autocomplete="email" required>
                </div>

                <div class="ds-field">
                    <label class="ds-label" for="password">Contraseña</label>
                    <input type="password" id="password" class="ds-input" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" class="ds-btn ds-btn--primary ds-btn--block" id="btn-login">Ingresar al ring</button>

                <div id="error-msg" class="ds-alert ds-alert--danger ds-mt-3" role="alert" hidden></div>
            </form>

            <p class="ds-center ds-mt-3" style="color:var(--ds-text-soft);font-size:0.92rem;">
                ¿No tienes cuenta? <a href="registro.html" class="ds-link">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <script src="auth.js?v=20260907v"></script>
    <script>
        (function () {
            const s = getSession();
            if (s && s.id && getToken()) {
                window.location.href = destinoSegunSesion(s);
                return;
            }
            // apiFetch nos manda aquí cuando el token vence
            if (new URLSearchParams(location.search).has("expirada")) {
                const aviso = document.getElementById("aviso");
                aviso.textContent = "Tu sesión expiró. Vuelve a iniciar sesión.";
                aviso.hidden = false;
            }
        })();

        const form = document.getElementById("loginForm");
        const btn = document.getElementById("btn-login");
        const errorMsg = document.getElementById("error-msg");
        const aviso = document.getElementById("aviso");

        function mostrarError(texto, tipo) {
            const caja = tipo === "revision" ? aviso : errorMsg;
            caja.textContent = texto;
            caja.hidden = false;
            if (tipo === "revision") errorMsg.hidden = true; else aviso.hidden = true;
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            btn.textContent = "Verificando...";
            btn.disabled = true;
            errorMsg.hidden = true;
            aviso.hidden = true;

            try {
                const res = await fetch(API + "/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await res.json();

                if (res.ok && data.success && data.token && data.data) {
                    saveSession(data.token, data.data);
                    window.location.href = destinoSegunSesion(data.data);
                    return;
                }

                btn.textContent = "Ingresar al ring";
                btn.disabled = false;
                if (data.pendingReview) {
                    mostrarError(data.message || "Tu cuenta está en revisión. Espera la activación.", "revision");
                } else {
                    mostrarError(data.message || "Credenciales inválidas.");
                }
            } catch (err) {
                btn.textContent = "Ingresar al ring";
                btn.disabled = false;
                mostrarError("Error de conexión. Intenta de nuevo.");
            }
        });
    </script>
</body>
</html>
